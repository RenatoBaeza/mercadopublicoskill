<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reporte de licitaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a slim bar with one tab per report, and the active report below it filling the rest of
   the window. Each report is a full page of its own (own styles, scripts and saved stars), so it
   runs in an iframe built from the embedded HTML the first time its tab is opened. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --ink: #111827;
  --ink-2: #4b5563;
  --muted: #7b8494;
  --line: #e3e6ec;
  --accent: #1f4e78;
  --accent-wash: #e8eff7;
  --f-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --ink: #f3f4f6; --ink-2: #c2c8d2; --muted: #8b93a1;
    --line: #262c35; --accent: #8db8e8; --accent-wash: #1b2a3b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --ink: #f3f4f6; --ink-2: #c2c8d2; --muted: #8b93a1;
  --line: #262c35; --accent: #8db8e8; --accent-wash: #1b2a3b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  display: flex; flex-direction: column;
}
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

header.bar {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px;
  padding: 10px 20px 0; padding-top: max(10px, env(safe-area-inset-top));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { font: 800 16px/1.2 var(--f-display); letter-spacing: -.01em; padding-bottom: 10px; }
.brand span { font: 500 13px/1 var(--f-body); color: var(--muted); margin-left: 8px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer; color: var(--ink-2);
  font: 600 14px/1.2 var(--f-body); padding: 8px 12px 11px; white-space: nowrap;
  border-bottom: 3px solid transparent; text-align: left;
}
.tab small { display: block; font: 400 11px/1.3 var(--f-body); color: var(--muted); margin-top: 2px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab.missing { opacity: .6; }

main { flex: 1; min-height: 0; position: relative; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
.empty { max-width: 560px; margin: 64px auto; padding-inline: 20px; color: var(--ink-2); }
.empty h2 { font: 700 20px/1.2 var(--f-display); color: var(--ink); margin: 0 0 8px; }
.empty code {
  display: block; margin-top: 12px; padding: 10px 12px; overflow-x: auto; white-space: pre;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font-size: 13px;
}
@media (max-width: 640px) {
  header.bar { padding-inline: 16px; }
  .brand span { display: none; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand" id="brand">Licitaciones<span id="generated"></span></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Reportes"></nav>
</header>
<main id="main"></main>
<script>
var REPORT = /*__DATA__*/;
(function () {
  var tabs = document.getElementById("tabs"), main = document.getElementById("main");
  var frames = {};
  if (REPORT.empresa) document.getElementById("brand").firstChild.textContent = "Licitaciones · " + REPORT.empresa;
  document.getElementById("generated").textContent = "actualizado " + REPORT.generado.replace("T", " ");

  REPORT.paginas.forEach(function (p) {
    var b = document.createElement("button");
    b.className = "tab" + (p.html ? "" : " missing");
    b.id = "tab-" + p.id;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-controls", "panel-" + p.id);
    b.appendChild(document.createTextNode(p.titulo));
    var s = document.createElement("small");
    s.textContent = p.html ? p.resumen : "sin generar";
    b.appendChild(s);
    b.addEventListener("click", function () { show(p.id, true); });
    tabs.appendChild(b);
  });

  tabs.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var ids = REPORT.paginas.map(function (p) { return p.id; });
    var i = ids.indexOf(current) + (e.key === "ArrowRight" ? 1 : -1);
    var next = ids[(i + ids.length) % ids.length];
    show(next, true);
    document.getElementById("tab-" + next).focus();
  });

  var current = null;
  function show(id, push) {
    var p = REPORT.paginas.filter(function (x) { return x.id === id; })[0] || REPORT.paginas[0];
    current = p.id;
    REPORT.paginas.forEach(function (x) {
      var on = x.id === p.id;
      document.getElementById("tab-" + x.id).setAttribute("aria-selected", on);
      document.getElementById("tab-" + x.id).tabIndex = on ? 0 : -1;
      if (frames[x.id]) frames[x.id].hidden = !on;
    });
    if (!frames[p.id]) {
      var el;
      if (p.html) {
        el = document.createElement("iframe");
        el.title = p.titulo;
        el.srcdoc = p.html;
      } else {
        el = document.createElement("div");
        el.className = "empty";
        el.innerHTML = "<h2></h2><p>Este reporte aún no se ha generado. Ejecuta:</p><code></code>";
        el.querySelector("h2").textContent = p.titulo;
        el.querySelector("code").textContent = p.comando;
      }
      el.id = "panel-" + p.id;
      el.setAttribute("role", "tabpanel");
      el.setAttribute("aria-labelledby", "tab-" + p.id);
      frames[p.id] = el;
      main.appendChild(el);
    }
    document.title = p.titulo + " · Reporte de licitaciones";
    if (push && location.hash !== "#" + p.id) history.replaceState(null, "", "#" + p.id);
  }

  window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
  var first = REPORT.paginas.filter(function (p) { return p.html; })[0];
  show(location.hash.slice(1) || (first || REPORT.paginas[0]).id);
})();
</script>
</body>
</html>
